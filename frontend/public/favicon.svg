<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Знак движения в уменьшенном виде. Полная эмблема на 16 пикселях
       превращается в кашу, поэтому во вкладке — монограмма: тёмно-синий
       круг, золотое кольцо и буквы ДБ. Сама эмблема остаётся на
       apple-touch-icon, где размера хватает. -->
  <circle cx="32" cy="32" r="31" fill="#0B1F3A"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <text x="32" y="41.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
        fill="#C9A227" letter-spacing="0.5">ДБ</text>
</svg>
